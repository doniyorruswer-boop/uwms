server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 15MB gacha bo'lgan hujjat va rasm fayllarini yuklashga ruxsat
    client_max_body_size 15M;

    # DNS resolver (Railway / Docker internal DNS)
    # 8.8.8.8 - Google DNS (public HTTPS backend URL uchun)
    # 127.0.0.11 - Docker internal DNS (fallback)
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 10s;

    # Gzip siqishni faollashtirish
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # SPA routing: Barcha marshrutlarni index.html ga yo'naltirish
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik assetlarni keshlash
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Backend API ga proksi marshruti
    # BACKEND_URL env orqali sozlanadi, envsubst orqali almashtiriladi
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Xavfsizlik sarlavhalari
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
