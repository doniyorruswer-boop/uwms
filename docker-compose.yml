version: '3.8'

services:
  # ===================================================
  # 1. POSTGRESQL DATABASE (18-Alpine)
  # ===================================================
  db:
    image: postgres:18-alpine
    container_name: uwms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Xavfsizlik: Baza faqat Docker ichki tarmog‘iga ochiq, 5432 tashqi dunyodan yopilgan
    expose:
      - "5432"
    volumes:
      - uwms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uwms_network

  # ===================================================
  # 2. NESTJS BACKEND API (:4000)
  # ===================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uwms_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DOCUMENT_HMAC_SECRET: ${DOCUMENT_HMAC_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    expose:
      - "4000"
    volumes:
      - uwms_backups:/app/backups
      - uwms_uploads:/app/uploads
    networks:
      - uwms_network

  # ===================================================
  # 3. NGINX + VITE FRONTEND (:80)
  # ===================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: uwms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Docker Compose ichida nginx backend servisini bu URL orqali topadi
      BACKEND_URL: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - uwms_network

# ===================================================
# VOLUMES & NETWORKS
# ===================================================
volumes:
  uwms_pgdata:
    driver: local
  uwms_backups:
    driver: local
  uwms_uploads:
    driver: local

networks:
  uwms_network:
    driver: bridge
